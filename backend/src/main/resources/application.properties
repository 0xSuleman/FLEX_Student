# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/flex_student_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=f4a8b2c7e1d9063f5a7b3c8e2d1094f6a5b8c3e7d2f1a0b9c4e6d8f3a2b7c5e1d9f0a3b6c8e5d2f7a4b1c9e3d0f6a8b5c2e7d4f1a9b3c6e0d8f5a2b7c4e1
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173
